name: Warm release caches

# Tag refs can only restore Actions caches created on their own ref or on
# main, and main otherwise never builds the release targets — so release
# builds were compiling every dependency cold on all five platforms. This
# workflow builds the release targets on main whenever the dependency set
# changes; the release workflow then restores these caches and only has to
# compile the dairo crate itself.
#
# The job id MUST stay `build` and the cache key `release-<target>` — both
# are part of Swatinem/rust-cache's cache key and must match release.yml.
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/warm-release-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Warm ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NO macOS ENTRIES ON PURPOSE -- macOS runners bill at $0.062/min vs
          # $0.006 for Linux (10x). In July 2026, 209 macOS minutes cost $12.96
          # while 2,246 Linux minutes cost $13.48: macOS was ~45% of the org's
          # entire Actions spend from 4% of the minutes, and exhausting the
          # GitHub Free allowance blocks Actions across every repo in the org.
          #
          # The two Darwin targets (aarch64-apple-darwin, x86_64-apple-darwin)
          # therefore build ONLY on release tags, in release.yml. The trade-off
          # is accepted deliberately: those tag builds now compile their
          # dependencies cold. That is the cheaper side of the trade, because
          # dependency bumps to main are frequent while releases are rare -- a
          # cold compile per release costs less than a full macOS compile on
          # every Cargo.lock change. Revisit only if releases outpace dep bumps.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
          # Mirrors the 32-bit x86 (iSH) zigbuild entry in release.yml;
          # dispatching this workflow is also the harmless way to prove that
          # recipe in CI.
          - os: ubuntu-latest
            target: i586-unknown-linux-musl
            setup: sudo pip3 install --break-system-packages cargo-zigbuild
            build_cmd: zigbuild
            cargo_flags: --no-default-features --features tls-rustcrypto
            rustflags: --cfg chacha20_force_soft
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install target toolchain prerequisites
        if: ${{ matrix.setup }}
        run: ${{ matrix.setup }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo ${{ matrix.build_cmd || 'build' }} --release --locked --target ${{ matrix.target }} ${{ matrix.cargo_flags }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
