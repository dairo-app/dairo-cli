# Remote build on atlas — see the `atlas` CLI (github.com/luka-loehr/atlas).
#   atlas build   # cargo build --release on atlas, target/release synced back
#
# Plain release build, no cargo-lambda involved. Runs on the universal builder
# image; target/ stays on atlas between runs, so rebuilds there are incremental.
name = dairo-cli
image = universal
build = cargo build --release --locked
artifacts = target/release
